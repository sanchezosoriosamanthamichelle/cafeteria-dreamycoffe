<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Dreamy Coffee</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

    <main class="container py-5" style="max-width: 450px;">
        <div class="text-center mb-4">
            <h1>☾ Dreamy Coffee</h1>
            <p>Panel de administración</p>
        </div>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="alert alert-{{ categoria }}">
                    {{ mensaje }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input
                    type="text"
                    class="form-control"
                    id="usuario"
                    name="usuario"
                    required
                    autocomplete="username">
            </div>

            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input
                    type="password"
                    class="form-control"
                    id="contrasena"
                    name="contrasena"
                    required
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-dark w-100">
                Iniciar sesión
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('inicio') }}">Volver a la cafetería</a>
        </div>
    </main>

</body>
</html>
