
<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Dreamy Coffee | Café &amp; Sweets</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilos.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="dreamy-layout">

        <!-- BARRA LATERAL -->
        <aside class="sidebar">
            <a href="{{ url_for('inicio') }}" class="brand">
    <img
        src="{{ url_for('static', filename='img/logo-dreamy..png') }}"
        alt="Logo de Dreamy Coffee"
        class="brand-logo"
    >
    <span>dreamy-coffee</span>
</a>

            <!-- Buscador visual; conectaremos su funcionamiento después -->
            <form class="sidebar-search"
                  action="{{ url_for('inicio') }}"
                  method="get">
                <span aria-hidden="true">⌕</span>
                <input type="search"
                name="buscar"
                placeholder="Buscar..."
                aria-label="Buscar productos"
                value="{{ buscar or '' }}">
            </form>

            <!-- Navegación -->
            <nav class="sidebar-nav" aria-label="Menú principal">

                <a class="sidebar-link "
                   href="{{ url_for('inicio') }}">
                    <span class="sidebar-icon">⌂</span>
                    <span>Inicio</span>
                </a>

            <a class="sidebar-link"
                href="{{ url_for('menu') }}">
                <span class="sidebar-icon">☕</span>
                <span>Menú</span>
            </a>


<a class="sidebar-link"
   href="{{ url_for('login') }}">
    <span class="sidebar-icon">⚙</span>
    <span>Administración</span>
</a>


                <a class="sidebar-link"
                   href="{{ url_for('ayuda') }}">
                    <span class="sidebar-icon">♡</span>
                    <span>Ayuda</span>
                </a>

            </nav>

            <div class="sidebar-footer">
                <p>Good coffee,<br>soft moments</p>
                <span>♡ ───── ♡</span>
            </div>

        </aside>

        <!-- CONTENIDO DE CADA PÁGINA -->
        <main class="main-content">

<div class="top-actions">
    <a href="{{ url_for('ver_carrito') }}"
       class="cart-button"
       aria-label="Ver carrito de compras">
        <span class="cart-icon">🛒</span>
        <span>Carrito</span>
        <span class="cart-count">{{ cantidad_carrito }}</span>
    </a>
</div>



            {% block contenido %}{% endblock %}

        </main>

    </div>

    <script src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>

</body>
</html>
