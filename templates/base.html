
<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Dreamy Coffee | Café &amp; Sweets</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilos.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="dreamy-layout">

        <!-- BARRA LATERAL -->
        <aside class="sidebar">

            <a href="{{ url_for('inicio') }}" class="brand">
                <img
                    src="{{ url_for('static', filename='img/logo-dreamy..png') }}"
                    alt="Logo de Dreamy Coffee"
                    class="brand-logo"
                    >
                <span>Dreamy-Coffee</span>
            </a>

            <!-- BUSCADOR -->
            <form class="sidebar-search"
                  action="{{ url_for('inicio') }}"
                  method="get">

                <input type="search"
                       name="buscar"
                       placeholder="Buscar productos..."
                       aria-label="Buscar productos"
                       value="{{ buscar or '' }}">
                       <span aria-hidden="true">⌕</span>
            </form>

            <!-- NAVEGACIÓN -->
            <nav class="sidebar-nav" aria-label="Menú principal">

                <a class="sidebar-link" href="{{ url_for('inicio') }}">
    <span class="sidebar-icon">
        <i class="bi bi-house-fill"></i>
    </span>
    <span>Inicio</span>
</a>

          <a class="sidebar-link" href="{{ url_for('menu') }}">
                    <span class="sidebar-icon">☕</span>
                    <span>Menú</span>
                </a>

                <a class="sidebar-link" href="{{ url_for('reservar') }}">
                    <span class="sidebar-icon">
                        <i class="bi bi-calendar-heart"></i>
                    </span>
                    <span>Reservaciones</span>
                </a>

                <a class="sidebar-link" href="{{ url_for('ayuda') }}">
                    <span class="sidebar-icon">
                         <i class="bi bi-question-circle"></i>
                        </span>
                    <span>Ayuda</span>
                </a>

                <a class="sidebar-link" href="{{ url_for('login') }}">
                    <span class="sidebar-icon">⚙</span>
                    <span>Administración</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <p>Good coffee,<br>soft moments</p>
                <span>♡ ───── ♡</span>
            </div>

        </aside>

        <!-- CONTENIDO DE CADA PÁGINA -->
        <main class="main-content">

            {% block contenido %}{% endblock %}

        </main>

    </div>

    <script src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>

</body>
</html>
