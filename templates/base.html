<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de alumnos - version 2</title>
    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='bootstrap/css/bootstrap.min.css') }}">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-dark"
         data-bs-theme="dark"
         aria-label="Menú principal">

        <div class="container">

            <a class="navbar-brand"
               href="{{ url_for('inicio') }}">
                Registro del 5APV
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir o cerrar menú">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('inicio') }}">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('inicio') }}#registro">
                            Registrar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('inicio') }}#lista">
                            Lista de alumnos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('ayuda') }}">
                            Ayuda
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <main class="container py-4">

        <header class="mb-4">

            <p class="text-uppercase text-secondary small mb-1">
                Aplicaciones Web . Practica 03
            </p>

            <h1 class="h2">
                Registro de alumnos
            </h1>

            <p class="text-secondary">
                Consulta y organiza los datos del grupo.
            </p>

        </header>

        {% block contenido %}{% endblock %}

    </main>

    <footer class="container py-3 border-top text-secondary small">
        Laboratorio de Aplicaciones Web . Datos de practica
    </footer>

    <script src="{{ url_for('static',
        filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>

</body>

</html>
